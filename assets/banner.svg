<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#48cae4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 500; font-size: 20px; fill: #caf0f8; opacity: 0.9; }
      .badge-text { font-family: 'Segoe UI', Ubuntu, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; }
      .node-ring { animation: pulse 3s infinite ease-in-out; }
      @keyframes pulse {
        0% { r: 18px; opacity: 0.4; }
        50% { r: 26px; opacity: 0.8; }
        100% { r: 18px; opacity: 0.4; }
      }
      .wave { animation: float 6s infinite ease-in-out; }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>
  <circle cx="600" cy="150" r="280" fill="url(#glow)"/>

  <!-- Background Animated Network Lines (behind text) -->
  <g opacity="0.25" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="100" y1="50" x2="300" y2="120" />
    <line x1="300" y1="120" x2="200" y2="250" />
    <line x1="900" y1="60" x2="1050" y2="150" />
    <line x1="1050" y1="150" x2="950" y2="260" />
    <line x1="150" y1="180" x2="1050" y2="180" stroke-width="1"/>
  </g>

  <!-- Network Cluster Nodes (decorations background) -->
  <g fill="#0077b6" opacity="0.4">
    <circle cx="100" cy="50" r="10" />
    <circle cx="300" cy="120" r="14" />
    <circle cx="200" cy="250" r="12" />
    <circle cx="900" cy="60" r="12" />
    <circle cx="1050" cy="150" r="16" />
    <circle cx="950" cy="260" r="10" />
  </g>
  <g fill="none" stroke="#48cae4">
    <circle cx="300" cy="120" class="node-ring" stroke-width="2"/>
    <circle cx="1050" cy="150" class="node-ring" stroke-width="2"/>
  </g>

  <!-- Foreground Content Container -->
  <g class="wave">
    <!-- Icon/Logo representation -->
    <g transform="translate(100, 105)">
      <path d="M 40 0 L 80 20 L 80 60 L 40 80 L 0 60 L 0 20 Z" fill="url(#accent-grad)" stroke="#48cae4" stroke-width="2"/>
      <path d="M 40 0 L 80 20 L 40 40 L 0 20 Z" fill="#90e0ef" opacity="0.6"/>
      <path d="M 40 40 L 40 80" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Header & Subtitle -->
    <text x="210" y="130" class="title">Awesome Managed Apache Cassandra Database</text>
    <text x="210" y="170" class="subtitle">A Curated Ecosystem of Cloud Platforms, Kubernetes Operators & Open-Source Tooling</text>

    <!-- Category Pill Badges (Foreground) -->
    <g transform="translate(210, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#0077b6" opacity="0.8"/>
      <text x="65" y="20" class="badge-text" text-anchor="middle">⚡ Serverless</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="150" height="30" rx="15" fill="#023e8a" opacity="0.8"/>
      <text x="217" y="20" class="badge-text" text-anchor="middle">☸️ K8s Operators</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="160" height="30" rx="15" fill="#0096c7" opacity="0.8"/>
      <text x="384" y="20" class="badge-text" text-anchor="middle">📊 Wide-Column NoSQL</text>

      <!-- Pill 4 -->
      <rect x="476" y="0" width="140" height="30" rx="15" fill="#48cae4" opacity="0.3" stroke="#48cae4" stroke-width="1"/>
      <text x="546" y="20" class="badge-text" text-anchor="middle">🚀 ScyllaDB &amp; C++</text>
    </g>
  </g>
</svg>
