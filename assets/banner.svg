<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#48cae4"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e8a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Network Lines -->
  <g opacity="0.25" stroke="#48cae4" stroke-width="1.5" stroke-dasharray="6,6">
    <line x1="80" y1="50" x2="280" y2="120" />
    <line x1="280" y1="120" x2="180" y2="250" />
    <line x1="920" y1="60" x2="1080" y2="150" />
    <line x1="1080" y1="150" x2="980" y2="260" />
    <line x1="120" y1="180" x2="1080" y2="180" stroke-width="1"/>
  </g>

  <!-- Network Nodes -->
  <g fill="#0077b6" opacity="0.4">
    <circle cx="80" cy="50" r="10" />
    <circle cx="280" cy="120" r="14" />
    <circle cx="180" cy="250" r="12" />
    <circle cx="920" cy="60" r="12" />
    <circle cx="1080" cy="150" r="16" />
    <circle cx="980" cy="260" r="10" />
  </g>
  <g fill="none" stroke="#48cae4">
    <circle cx="280" cy="120" r="20" stroke-width="2" opacity="0.6"/>
    <circle cx="1080" cy="150" r="22" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Foreground Content Container -->
  <g>
    <!-- Icon/Logo -->
    <g transform="translate(60, 105)">
      <path d="M 40 0 L 80 20 L 80 60 L 40 80 L 0 60 L 0 20 Z" fill="url(#accent-grad)" stroke="#48cae4" stroke-width="2"/>
      <path d="M 40 0 L 80 20 L 40 40 L 0 20 Z" fill="#90e0ef" opacity="0.6"/>
      <path d="M 40 40 L 40 80" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Title & Subtitle with direct solid hex colors and standard font-family -->
    <text x="170" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff">Awesome Managed Apache Cassandra Database</text>
    <text x="170" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="19" fill="#caf0f8" opacity="0.95">A Curated Ecosystem of Cloud Platforms, Kubernetes Operators &amp; Open-Source Tooling</text>

    <!-- Category Pill Badges (Foreground) -->
    <g transform="translate(170, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#0077b6"/>
      <text x="65" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">Serverless</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="150" height="30" rx="15" fill="#023e8a"/>
      <text x="217" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">K8s Operators</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="160" height="30" rx="15" fill="#0096c7"/>
      <text x="384" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">Wide-Column NoSQL</text>

      <!-- Pill 4 -->
      <rect x="476" y="0" width="140" height="30" rx="15" fill="#1c2541" stroke="#48cae4" stroke-width="1.5"/>
      <text x="546" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" fill="#ffffff" text-anchor="middle">ScyllaDB &amp; C++</text>
    </g>
  </g>
</svg>
